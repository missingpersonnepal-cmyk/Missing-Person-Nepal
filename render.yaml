services:
  - type: web
    name: Missing-Person-Nepal
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: AUTO_CREATE_TABLES
        value: false
      - key: COOKIE_SECURE
        value: true
      - key: UPLOAD_DIR
        value: uploads
      - key: EXPORT_DIR
        value: exports
      - key: DISCOVERY_MAX_QUERIES_PER_RUN
        value: "12"
      - key: DISCOVERY_RESULTS_PER_QUERY
        value: "8"
      - key: DISCOVERY_REQUEST_DELAY_SECONDS
        value: "1.0"
      - key: DISCOVERY_TIMEOUT_SECONDS
        value: "15"
      - key: SMS_PROVIDER
        value: disabled
      - key: EMAIL_PROVIDER
        value: disabled
      - key: GEO_API_BASE_URL
        value: https://merogeo.com
      # Keep Supabase Storage private. These variables document the planned
      # object-storage migration; the application does not expose their values.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GEO_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SERPER_API_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
