{% extends "base.html" %}
{% block content %}
<h1>Report a Missing Person</h1>
<p>Provide the best information you have. A report is reviewed before it becomes public.</p>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
{% if success %}<div class="notice">{{ success }}</div>{% endif %}
<form method="post" enctype="multipart/form-data" class="card" id="report-form">
  <label>Disaster *</label><select name="disaster_id" required>{% for d in disasters %}<option value="{{ d.id }}">{{ d.name }}</option>{% endfor %}</select>
  <div class="inline"><div><label>Full name *</label><input name="name" required></div><div><label>Name in Nepali</label><input name="name_ne"></div></div>
  <div class="inline"><div><label>Age</label><input name="age" type="number" min="0" max="120"></div><div><label>Gender</label><input name="gender"></div></div>
  <label>Recent photo</label><input name="photo" type="file" accept="image/jpeg,image/png,image/webp">
  <label>Residential address (private/admin only)</label><textarea name="residential_address"></textarea>
  <div class="inline"><div><label>Last-seen date</label><input name="last_seen_date" type="date"></div><div><label>Last-seen time</label><input name="last_seen_time" type="time"></div></div>
  <label>Last-seen location *</label><input id="report-location" name="last_seen_location" list="report-place-suggestions" data-place-search required><datalist id="report-place-suggestions"></datalist>
  <input type="hidden" name="last_seen_lat" id="report-lat"><input type="hidden" name="last_seen_lon" id="report-lon">
  <div id="report-map" class="location-picker" data-map-picker data-lat-input="report-lat" data-lon-input="report-lon" data-location-input="report-location"></div>
  <label>Clothing last worn</label><textarea name="clothing"></textarea>
  <label>Identification details</label><textarea name="identification_details" placeholder="Height, build, glasses, scars, carried items, etc."></textarea>
  <label>Public contact number for information</label><input name="public_contact_number">
  <label>Existing public social-media/source link</label><input name="social_url" type="url" placeholder="https://facebook.com/..."><hr>
  <div class="inline"><div><label>Your name (private)</label><input name="reporter_name"></div><div><label>Your phone (private)</label><input name="reporter_phone"></div><div><label>Relationship</label><input name="reporter_relationship"></div></div>
  <label>Additional notes</label><textarea name="notes"></textarea>
  <button type="submit">Submit report</button>
</form>
<script>
const reportForm = document.getElementById('report-form');
const REPORT_QUEUE = 'missing-person-report-queue';
function queuedReports() { try { return JSON.parse(localStorage.getItem(REPORT_QUEUE) || '[]'); } catch (_) { return []; } }
async function flushReports() {
  const queue = queuedReports();
  for (const data of queue) { try { const response = await fetch('/report', {method:'POST', body:new URLSearchParams(data)}); if (!response.ok) return; } catch (_) { return; } }
  localStorage.removeItem(REPORT_QUEUE);
}
window.addEventListener('online', flushReports);
reportForm.addEventListener('submit', (event) => {
  if (navigator.onLine) return;
  event.preventDefault();
  const data = Object.fromEntries(new FormData(reportForm));
  delete data.photo;
  const queue = queuedReports(); queue.push(data); localStorage.setItem(REPORT_QUEUE, JSON.stringify(queue));
  alert('No connection. Your report details were saved on this device and will retry when you are online. Photos must be added after reconnecting.');
});
</script>
{% endblock %}
