{% extends "base.html" %}
{% block content %}
<h1>Reset Password</h1>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
<form method="post" class="card">
  <p><strong>{{ user.username }}</strong></p>
  <label>New password</label><input name="password" type="password" required>
  <label>Confirm password</label><input name="confirm_password" type="password" required>
  <label><input type="checkbox" name="must_change_password" value="1"> Must change password on next login</label>
  <button>Reset password</button>
</form>
{% endblock %}
